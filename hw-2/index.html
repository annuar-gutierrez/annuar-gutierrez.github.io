<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TIC TAC TOE</title>
        <script src="js/script.js"></script>
    </head>
    <body>
    <div class="container">
        <h1 id="game-status">Player X's Turn</h1>
        <div class="game-board" id="game-board">
            <!-- 9 buttons for the squares will be generated by JavaScript -->
            <button class="square" data-cell-index="0"></button>
            <button class="square" data-cell-index="1"></button>
            <button class="square" data-cell-index="2"></button>
            <button class="square" data-cell-index="3"></button>
            <button class="square" data-cell-index="4"></button>
            <button class="square" data-cell-index="5"></button>
            <button class="square" data-cell-index="6"></button>
            <button class="square" data-cell-index="7"></button>
            <button class="square" data-cell-index="8"></button>
        </div>
        <button id="restart-button">Restart Game</button>
    </div>
</body>
</html>
